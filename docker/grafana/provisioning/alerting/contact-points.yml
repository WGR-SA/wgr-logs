apiVersion: 1

contactPoints:
  - orgId: 1
    name: slack-wgr-alerts
    receivers:
      - uid: slack-wgr-alerts-1
        type: slack
        settings:
          url: $SLACK_WEBHOOK_URL
          recipient: $SLACK_CHANNEL
          username: WGR Logs
          icon_emoji: ":rotating_light:"
          title: "{{ if eq .Status \"firing\" }}🔥{{ else }}✅{{ end }} {{ .CommonLabels.alertname }}"
          text: |
            *Status:* {{ .Status }}
            *Severity:* {{ .CommonLabels.severity }}
            *App:* {{ .CommonLabels.app }}
            *Env:* {{ .CommonLabels.env }}
            {{ range .Alerts }}
            • {{ .Annotations.summary }}
              <{{ .GeneratorURL }}|Voir dans Grafana>
            {{ end }}

policies:
  - orgId: 1
    receiver: slack-wgr-alerts
    group_by: ["alertname", "app", "env"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
