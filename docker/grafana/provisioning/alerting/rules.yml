apiVersion: 1

groups:
  - orgId: 1
    name: wgr-core
    folder: WGR
    interval: 1m
    rules:
      - uid: error_rate_high
        title: Taux d'erreurs élevé
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki
            model:
              expr: 'sum by (app, env) (rate({level="error"}[5m]))'
              queryType: range
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.5] }
              refId: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.app }}/{{ $labels.env }} : > 0.5 erreurs/s sur 5min"

      - uid: app_down
        title: App silencieuse (10min sans logs)
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: loki
            model:
              expr: 'sum by (app) (count_over_time({app=~".+"}[10m]))'
              queryType: range
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Aucun log de {{ $labels.app }} depuis 10min"

      - uid: http_5xx_spike
        title: Pic de 5xx HTTP
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki
            model:
              expr: 'sum by (app) (rate({app=~".+"} |~ "\"status\":5[0-9]{2}" [5m]))'
              queryType: range
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [5] }
              refId: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.app }} : > 5 réponses 5xx/s sur 5min"
