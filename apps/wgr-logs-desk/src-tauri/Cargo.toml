[package]
name = "wgr-logs-desk"
version = "0.1.0"
description = "WGR Logs — desktop client for the WGR observability stack"
authors = ["WGR SA <hello@wgr.ch>"]
license = "MIT"
repository = "https://github.com/wgr-sa/wgr-logs"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "wgr_logs_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
tauri = { version = "2.11.0", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
anyhow = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
