name: wgr-logs

services:
  traefik:
    image: traefik:v2.11
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    restart: always
    networks:
      - wgr-logs

  loki:
    image: grafana/loki:3.2.0
    user: "10001:10001"
    command: -config.file=/etc/loki/loki-config.yaml -config.expand-env=true
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET_CHUNKS: ${S3_BUCKET_CHUNKS}
      S3_BUCKET_RULER: ${S3_BUCKET_RULER}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      INGEST_AUTH_TOKEN: ${INGEST_AUTH_TOKEN}
    volumes:
      - ./docker/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    labels:
      - traefik.enable=true
      - traefik.http.routers.ingest.entrypoints=websecure
      - traefik.http.routers.ingest.rule=Host(`${INGEST_DOMAIN}`)
      - traefik.http.routers.ingest.tls=true
      - traefik.http.routers.ingest.tls.certresolver=letsencrypt
      - traefik.http.routers.ingest.middlewares=cors-ingest@docker,ingest-auth@docker
      - traefik.http.services.ingest.loadbalancer.server.port=3100
      - traefik.http.middlewares.ingest-auth.headers.customrequestheaders.X-Scope-OrgID=wgr
      - traefik.http.middlewares.cors-ingest.headers.accessControlAllowOriginList=*
      - traefik.http.middlewares.cors-ingest.headers.accessControlAllowMethods=GET,POST,OPTIONS,HEAD
      - traefik.http.middlewares.cors-ingest.headers.accessControlAllowHeaders=Content-Type,Authorization,X-Scope-OrgID
      - traefik.http.middlewares.cors-ingest.headers.accessControlExposeHeaders=*
      - traefik.http.middlewares.cors-ingest.headers.accessControlMaxAge=86400
      - traefik.http.middlewares.cors-ingest.headers.addVaryHeader=true
    networks:
      - wgr-logs

  grafana:
    image: grafana/grafana-oss:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ""
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      SLACK_CHANNEL: ${SLACK_CHANNEL}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.rule=Host(`${LOGS_DOMAIN}`)
      - traefik.http.routers.grafana.tls=true
      - traefik.http.routers.grafana.tls.certresolver=letsencrypt
      - traefik.http.routers.grafana.middlewares=cors-grafana@docker
      - traefik.http.services.grafana.loadbalancer.server.port=3000
      - traefik.http.middlewares.cors-grafana.headers.accessControlAllowOriginList=tauri://localhost,http://localhost:1421,http://localhost:3000
      - traefik.http.middlewares.cors-grafana.headers.accessControlAllowMethods=GET,POST,OPTIONS,HEAD
      - traefik.http.middlewares.cors-grafana.headers.accessControlAllowHeaders=Content-Type,Authorization
      - traefik.http.middlewares.cors-grafana.headers.accessControlAllowCredentials=true
      - traefik.http.middlewares.cors-grafana.headers.accessControlMaxAge=86400
      - traefik.http.middlewares.cors-grafana.headers.addVaryHeader=true
    networks:
      - wgr-logs

  # Eat-the-dogfood: the wgr-logs VPS itself is a managed agent,
  # piloted from the desktop UI like any other server.
  shipper:
    image: ghcr.io/wgr-sa/wgr-logs-shipper:latest
    restart: always
    environment:
      WGR_API_URL: https://${LOGS_DOMAIN}/mgmt
      WGR_INGEST_URL: https://${INGEST_DOMAIN}/loki/api/v1/push
      WGR_INGEST_USER: wgr
      WGR_INGEST_TOKEN: ${INGEST_AUTH_TOKEN}
      WGR_REGISTER_TOKEN: ${WGR_API_REGISTER_TOKEN}
      WGR_AGENT_NAME: wgr-logs-self
      WGR_POLL_INTERVAL: "60"
    volumes:
      - shipper-state:/state
      - /var/log:/var/log:ro
      # Map persistent journal (/var/log/journal) into the path the journald module expects.
      # Fallback to /run/log/journal (volatile) for systems without persistent journals.
      - /var/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - wgr-logs

  pg:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PG_DATABASE_NAME:-wgr_logs}
      POSTGRES_USER: ${PG_DATABASE_USER:-wgrlogs}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U ${PG_DATABASE_USER:-wgrlogs} -d ${PG_DATABASE_NAME:-wgr_logs}
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - wgr-logs

  api:
    image: ghcr.io/wgr-sa/wgr-logs-api:latest
    environment:
      API_PORT: 3000
      NODE_ENV: production
      PG_HOST: pg
      PG_PORT: 5432
      PG_USER: ${PG_DATABASE_USER:-wgrlogs}
      PG_PASSWORD: ${PG_DATABASE_PASSWORD}
      PG_DATABASE: ${PG_DATABASE_NAME:-wgr_logs}
      ADMIN_TOKEN: ${WGR_API_ADMIN_TOKEN}
      REGISTER_TOKEN: ${WGR_API_REGISTER_TOKEN}
    depends_on:
      pg:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/mgmt/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    labels:
      - traefik.enable=true
      - traefik.http.routers.wgr-api.entrypoints=websecure
      - traefik.http.routers.wgr-api.rule=Host(`${LOGS_DOMAIN}`) && PathPrefix(`/mgmt`)
      - traefik.http.routers.wgr-api.tls=true
      - traefik.http.routers.wgr-api.tls.certresolver=letsencrypt
      - traefik.http.routers.wgr-api.middlewares=cors-api@docker
      - traefik.http.services.wgr-api.loadbalancer.server.port=3000
      - traefik.http.middlewares.cors-api.headers.accessControlAllowOriginList=tauri://localhost,http://localhost:1421,http://localhost:3000
      - traefik.http.middlewares.cors-api.headers.accessControlAllowMethods=GET,POST,PUT,DELETE,PATCH,OPTIONS,HEAD
      - traefik.http.middlewares.cors-api.headers.accessControlAllowHeaders=Content-Type,Authorization
      - traefik.http.middlewares.cors-api.headers.accessControlAllowCredentials=true
      - traefik.http.middlewares.cors-api.headers.accessControlMaxAge=86400
      - traefik.http.middlewares.cors-api.headers.addVaryHeader=true
    networks:
      - wgr-logs

  pg-backup:
    image: prodrigestivill/postgres-backup-local:16
    environment:
      POSTGRES_HOST: pg
      POSTGRES_DB: ${PG_DATABASE_NAME:-wgr_logs}
      POSTGRES_USER: ${PG_DATABASE_USER:-wgrlogs}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD}
      POSTGRES_EXTRA_OPTS: "--clean --if-exists --no-owner --no-privileges"
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 3
    volumes:
      - pg-backups:/backups
    depends_on:
      pg:
        condition: service_healthy
    restart: always
    networks:
      - wgr-logs

volumes:
  traefik-letsencrypt:
  loki-data:
  grafana-data:
  shipper-state:
  pg-data:
  pg-backups:

networks:
  wgr-logs:
    name: wgr-logs
